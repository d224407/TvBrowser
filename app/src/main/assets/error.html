<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<body style="background:#0b0f17;color:#e8ecf3;font:28px sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center">
<div>
<h1 id="t"></h1>
<p id="d" style="opacity:.7"></p>
<a id="r" href="#" style="display:inline-block;margin-top:24px;padding:14px 32px;border-radius:12px;background:#4fc3f7;color:#000;text-decoration:none"></a>
<a id="x" href="#" style="display:none;margin:24px 0 0 16px;padding:14px 32px;border-radius:12px;background:#2b3a55;color:#fff;text-decoration:none"></a>
</div>
<script>
var q = new URLSearchParams(location.search);
var u = q.get("u") || "";
document.getElementById("t").textContent = q.get("t") || "";
document.getElementById("d").textContent = q.get("d") || "";
var r = document.getElementById("r");
r.textContent = q.get("r") || "";
r.href = u || "#";
var xl = q.get("x");
if (xl) {
  var a = document.getElementById("x");
  a.textContent = xl;
  a.href = "tvb-proceed://x/?u=" + encodeURIComponent(u);
  a.style.display = "inline-block";
}
</script>
