name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "v$VERSION_NAME" --generate-notes

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        flavor: [generic, gecko]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
      - name: Decode keystore
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
        run: echo "$KEYSTORE_CONTENT" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build generic
        if: matrix.flavor == 'generic'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleGenericRelease --no-daemon
      - name: Build gecko (one APK per ABI)
        if: matrix.flavor == 'gecko'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleGeckoRelease -PabiSplit --no-daemon
      - name: Collect APKs
        run: |
          mkdir dist
          for f in app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk; do
            n=${f##*/}
            if [ "${{ matrix.flavor }}" = generic ]; then
              cp "$f" dist/TvBrowser-generic.apk
            else
              n=${n#app-gecko-}
              n=${n%-release*}
              cp "$f" "dist/TvBrowser-gecko-$n.apk"
            fi
          done
          ls -l dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
