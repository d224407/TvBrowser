name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
      - name: Decode keystore
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
        run: echo "$KEYSTORE_CONTENT" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk TvBrowser.apk
          gh release create "v$VERSION_NAME" TvBrowser.apk --title "v$VERSION_NAME" --generate-notes
